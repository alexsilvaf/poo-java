<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 760" role="img" aria-labelledby="title description">
  <title id="title">Modelo de execução do Java</title>
  <desc id="description">O código-fonte é compilado para bytecode, que a JVM interpreta e compila just-in-time para código de máquina.</desc>

  <defs>
    <linearGradient id="codeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9a0" />
      <stop offset="100%" stop-color="#ffbd0a" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72b5e5" />
      <stop offset="100%" stop-color="#347fbd" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#163d5c" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1900" height="760" rx="20" fill="#ffffff" />

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Código-fonte -->
    <g filter="url(#shadow)">
      <rect x="60" y="260" width="480" height="220" rx="10" fill="url(#codeGradient)" stroke="#c7cbd1" stroke-width="2" />
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="24">
      <text x="90" y="305" fill="#7c3aed">public</text>
      <text x="200" y="305" fill="#1f2937">class Ola {</text>
      <text x="120" y="345" fill="#7c3aed">public static void</text>
      <text x="120" y="378" fill="#1f2937">  main(String[] a) {</text>
      <text x="150" y="415" fill="#1f2937">System.out.<tspan fill="#b45309">print</tspan>(</text>
      <text x="150" y="448" fill="#b45309">  "Olá, mundo!");</text>
      <text x="90" y="465" fill="#1f2937">}}</text>
    </g>

    <!-- código -> bytecode -->
    <path d="M580 350 H770 V320 L815 370 L770 420 V390 H580 Z" fill="url(#arrowGradient)" stroke="#286ca4" stroke-width="3" />
    <text x="697" y="300" font-size="28" text-anchor="middle" fill="#111827" font-weight="700">compilação</text>
    <text x="697" y="450" font-size="28" text-anchor="middle" fill="#111827" font-weight="700">javac</text>

    <!-- Bytecode -->
    <g filter="url(#shadow)">
      <rect x="840" y="255" width="420" height="230" rx="10" fill="url(#boxGradient)" stroke="#b88600" stroke-width="3" />
    </g>
    <text x="1050" y="350" font-size="34" text-anchor="middle" fill="#111827">Bytecode</text>
    <text x="1050" y="390" font-size="24" text-anchor="middle" fill="#5a4200">(representação intermediária)</text>

    <!-- bytecode -> código de máquina -->
    <path d="M1300 370 H1460 V340 L1505 390 L1460 440 V410 H1300 Z" fill="url(#arrowGradient)" stroke="#286ca4" stroke-width="3" />
    <text x="1400" y="320" font-size="27" text-anchor="middle" fill="#111827" font-weight="700">JIT</text>
    <text x="1400" y="530" font-size="22" text-anchor="middle" fill="#6b7280" font-style="italic">interpretação / JIT — Máquina Virtual Java (JVM)</text>

    <!-- Código de máquina -->
    <g filter="url(#shadow)">
      <rect x="1520" y="255" width="340" height="230" rx="10" fill="url(#boxGradient)" stroke="#b88600" stroke-width="3" />
    </g>
    <text x="1690" y="360" font-size="30" text-anchor="middle" fill="#111827">Código de</text>
    <text x="1690" y="400" font-size="30" text-anchor="middle" fill="#111827">máquina</text>

    <text x="950" y="60" font-size="30" text-anchor="middle" fill="#111827" font-weight="700">Compilação just-in-time (JIT) é mais rápida que interpretação pura</text>
    <text x="950" y="640" font-size="30" text-anchor="middle" fill="#111827">O coletor de lixo (garbage collector) libera a memória automaticamente</text>
  </g>
</svg>
