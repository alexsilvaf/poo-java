<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 620" role="img" aria-labelledby="title description">
  <title id="title">Uma aplicação é composta por classes</title>
  <desc id="description">Diversas caixas soltas, cada uma representando uma classe, ilustram que um programa Java é formado por várias classes.</desc>

  <defs>
    <linearGradient id="yellowGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe29a" />
      <stop offset="100%" stop-color="#ffbd0a" />
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8b48a" />
      <stop offset="100%" stop-color="#ed7d31" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9d18e" />
      <stop offset="100%" stop-color="#70ad47" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#163d5c" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1900" height="620" rx="20" fill="#ffffff" />

  <g font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" filter="url(#shadow)">
    <rect x="90"   y="70"  width="220" height="90" rx="8" fill="url(#yellowGradient)" stroke="#b88600" stroke-width="2.5" />
    <rect x="420"  y="130" width="220" height="90" rx="8" fill="url(#orangeGradient)" stroke="#b55418" stroke-width="2.5" />
    <rect x="760"  y="60"  width="220" height="90" rx="8" fill="url(#greenGradient)"  stroke="#4f7f30" stroke-width="2.5" />
    <rect x="1080" y="140" width="220" height="90" rx="8" fill="url(#yellowGradient)" stroke="#b88600" stroke-width="2.5" />
    <rect x="1420" y="80"  width="220" height="90" rx="8" fill="url(#orangeGradient)" stroke="#b55418" stroke-width="2.5" />

    <rect x="250"  y="280" width="220" height="90" rx="8" fill="url(#greenGradient)"  stroke="#4f7f30" stroke-width="2.5" />
    <rect x="580"  y="330" width="220" height="90" rx="8" fill="url(#yellowGradient)" stroke="#b88600" stroke-width="2.5" />
    <rect x="920"  y="290" width="220" height="90" rx="8" fill="url(#orangeGradient)" stroke="#b55418" stroke-width="2.5" />
    <rect x="1260" y="340" width="220" height="90" rx="8" fill="url(#greenGradient)"  stroke="#4f7f30" stroke-width="2.5" />
    <rect x="1580" y="270" width="220" height="90" rx="8" fill="url(#yellowGradient)" stroke="#b88600" stroke-width="2.5" />

    <rect x="120"  y="470" width="220" height="90" rx="8" fill="url(#orangeGradient)" stroke="#b55418" stroke-width="2.5" />
    <rect x="700"  y="480" width="220" height="90" rx="8" fill="url(#greenGradient)"  stroke="#4f7f30" stroke-width="2.5" />
    <rect x="1150" y="470" width="220" height="90" rx="8" fill="url(#yellowGradient)" stroke="#b88600" stroke-width="2.5" />
    <rect x="1500" y="490" width="220" height="90" rx="8" fill="url(#orangeGradient)" stroke="#b55418" stroke-width="2.5" />
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" fill="#1f2937">
    <text x="200"  y="123">Class</text>
    <text x="530"  y="183">Class</text>
    <text x="870"  y="113">Class</text>
    <text x="1190" y="193">Class</text>
    <text x="1530" y="133">Class</text>

    <text x="360"  y="333">Class</text>
    <text x="690"  y="383">Class</text>
    <text x="1030" y="343">Class</text>
    <text x="1370" y="393">Class</text>
    <text x="1690" y="323">Class</text>

    <text x="230"  y="523">Class</text>
    <text x="810"  y="533">Class</text>
    <text x="1260" y="523">Class</text>
    <text x="1610" y="543">Class</text>
  </g>
</svg>
