<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 980" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de uma linguagem interpretada</title>
  <desc id="description">O mesmo código-fonte em PHP é lido por um interpretador diferente em cada sistema operacional, sem gerar um executável específico.</desc>

  <defs>
    <linearGradient id="codeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8b48a" />
      <stop offset="100%" stop-color="#ed7d31" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9dc3e6" />
      <stop offset="100%" stop-color="#5b9bd5" />
    </linearGradient>
    <linearGradient id="grayGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9c9c9" />
      <stop offset="100%" stop-color="#a5a5a5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#163d5c" flood-opacity="0.18" />
    </filter>
    <marker id="arrowhead" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="18" refY="13" orient="auto">
      <path d="M0,0 L26,13 L0,26 Z" fill="#9ca3af" />
    </marker>
  </defs>

  <rect width="1900" height="980" rx="20" fill="#ffffff" />

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Código-fonte -->
    <g filter="url(#shadow)">
      <rect x="660" y="30" width="580" height="230" rx="10" fill="url(#codeGradient)" stroke="#c7cbd1" stroke-width="2" />
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="26">
      <text x="690" y="75" fill="#7c3aed">&lt;?php</text>
      <text x="720" y="120" fill="#b45309">echo "Olá, mundo!";</text>
      <text x="690" y="165" fill="#1f2937">?&gt;</text>
    </g>

    <!-- Setas divergentes -->
    <path d="M800 260 L280 470" stroke="#9ca3af" stroke-width="10" fill="none" marker-end="url(#arrowhead)" />
    <path d="M950 260 L950 470" stroke="#9ca3af" stroke-width="10" fill="none" marker-end="url(#arrowhead)" />
    <path d="M1100 260 L1620 470" stroke="#9ca3af" stroke-width="10" fill="none" marker-end="url(#arrowhead)" />

    <!-- Três pilhas: Windows, Mac, Linux -->
    <g filter="url(#shadow)">
      <rect x="80" y="500" width="400" height="120" fill="url(#orangeGradient)" stroke="#b55418" stroke-width="3" />
      <rect x="80" y="620" width="400" height="120" fill="url(#blueGradient)" stroke="#3776ad" stroke-width="3" />
      <rect x="80" y="740" width="400" height="120" fill="url(#grayGradient)" stroke="#777777" stroke-width="3" />

      <rect x="750" y="500" width="400" height="120" fill="url(#orangeGradient)" stroke="#b55418" stroke-width="3" />
      <rect x="750" y="620" width="400" height="120" fill="url(#blueGradient)" stroke="#3776ad" stroke-width="3" />
      <rect x="750" y="740" width="400" height="120" fill="url(#grayGradient)" stroke="#777777" stroke-width="3" />

      <rect x="1420" y="500" width="400" height="120" fill="url(#orangeGradient)" stroke="#b55418" stroke-width="3" />
      <rect x="1420" y="620" width="400" height="120" fill="url(#blueGradient)" stroke="#3776ad" stroke-width="3" />
      <rect x="1420" y="740" width="400" height="120" fill="url(#grayGradient)" stroke="#777777" stroke-width="3" />
    </g>

    <g fill="#ffffff" font-size="30" text-anchor="middle">
      <text x="280" y="568">Interpretador p/ Windows</text>
      <text x="280" y="688">Windows</text>
      <text x="280" y="808">Hardware</text>

      <text x="950" y="568">Interpretador p/ Mac</text>
      <text x="950" y="688">Mac OS</text>
      <text x="950" y="808">Hardware</text>

      <text x="1620" y="568">Interpretador p/ Linux</text>
      <text x="1620" y="688">Linux</text>
      <text x="1620" y="808">Hardware</text>
    </g>

    <text x="950" y="920" font-size="34" text-anchor="middle" fill="#111827">Linguagem interpretada — PHP, Python, JavaScript</text>
  </g>
</svg>
