<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1080" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de uma linguagem híbrida</title>
  <desc id="description">O código-fonte Java é compilado uma única vez para bytecode, que é executado por uma JVM específica de cada sistema operacional.</desc>

  <defs>
    <linearGradient id="codeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9d18e" />
      <stop offset="100%" stop-color="#70ad47" />
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8b48a" />
      <stop offset="100%" stop-color="#ed7d31" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9dc3e6" />
      <stop offset="100%" stop-color="#5b9bd5" />
    </linearGradient>
    <linearGradient id="grayGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9c9c9" />
      <stop offset="100%" stop-color="#a5a5a5" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72b5e5" />
      <stop offset="100%" stop-color="#347fbd" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#163d5c" flood-opacity="0.18" />
    </filter>
    <marker id="arrowhead" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="18" refY="13" orient="auto">
      <path d="M0,0 L26,13 L0,26 Z" fill="#9ca3af" />
    </marker>
  </defs>

  <rect width="1900" height="1080" rx="20" fill="#ffffff" />

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Código-fonte -->
    <g filter="url(#shadow)">
      <rect x="60" y="90" width="560" height="260" rx="10" fill="url(#codeGradient)" stroke="#c7cbd1" stroke-width="2" />
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="24">
      <text x="90" y="135" fill="#7c3aed">public</text>
      <text x="205" y="135" fill="#1f2937">class Ola {</text>
      <text x="120" y="175" fill="#7c3aed">public static void</text>
      <text x="120" y="205" fill="#1f2937">  main(String[] a) {</text>
      <text x="150" y="245" fill="#1f2937">System.out.<tspan fill="#b45309">println</tspan>(</text>
      <text x="150" y="278" fill="#b45309">  "Olá, mundo!");</text>
      <text x="120" y="310" fill="#1f2937">}</text>
      <text x="90" y="335" fill="#1f2937">}</text>
    </g>

    <!-- Seta código -> bytecode -->
    <path d="M660 220 H930 V190 L975 240 L930 290 V260 H660 Z" fill="url(#arrowGradient)" stroke="#286ca4" stroke-width="3" />
    <text x="815" y="180" font-size="30" text-anchor="middle" fill="#111827" font-weight="700">compilador (javac)</text>

    <!-- Bytecode -->
    <g filter="url(#shadow)">
      <rect x="1000" y="130" width="440" height="220" rx="10" fill="url(#greenGradient)" stroke="#4f7f30" stroke-width="3" />
    </g>
    <text x="1220" y="235" font-size="36" text-anchor="middle" fill="#ffffff">Bytecode</text>
    <text x="1220" y="280" font-size="24" text-anchor="middle" fill="#f0fdf4">independente de plataforma</text>

    <!-- Setas divergentes -->
    <path d="M1150 350 L280 570" stroke="#9ca3af" stroke-width="10" fill="none" marker-end="url(#arrowhead)" />
    <path d="M1220 350 L950 570" stroke="#9ca3af" stroke-width="10" fill="none" marker-end="url(#arrowhead)" />
    <path d="M1290 350 L1620 570" stroke="#9ca3af" stroke-width="10" fill="none" marker-end="url(#arrowhead)" />

    <!-- Três pilhas: Windows, Mac, Linux -->
    <g filter="url(#shadow)">
      <rect x="80" y="600" width="400" height="120" fill="url(#orangeGradient)" stroke="#b55418" stroke-width="3" />
      <rect x="80" y="720" width="400" height="120" fill="url(#blueGradient)" stroke="#3776ad" stroke-width="3" />
      <rect x="80" y="840" width="400" height="120" fill="url(#grayGradient)" stroke="#777777" stroke-width="3" />

      <rect x="750" y="600" width="400" height="120" fill="url(#orangeGradient)" stroke="#b55418" stroke-width="3" />
      <rect x="750" y="720" width="400" height="120" fill="url(#blueGradient)" stroke="#3776ad" stroke-width="3" />
      <rect x="750" y="840" width="400" height="120" fill="url(#grayGradient)" stroke="#777777" stroke-width="3" />

      <rect x="1420" y="600" width="400" height="120" fill="url(#orangeGradient)" stroke="#b55418" stroke-width="3" />
      <rect x="1420" y="720" width="400" height="120" fill="url(#blueGradient)" stroke="#3776ad" stroke-width="3" />
      <rect x="1420" y="840" width="400" height="120" fill="url(#grayGradient)" stroke="#777777" stroke-width="3" />
    </g>

    <g fill="#ffffff" font-size="30" text-anchor="middle">
      <text x="280" y="668">JVM p/ Windows</text>
      <text x="280" y="788">Windows</text>
      <text x="280" y="908">Hardware</text>

      <text x="950" y="668">JVM p/ Mac OS</text>
      <text x="950" y="788">Mac OS</text>
      <text x="950" y="908">Hardware</text>

      <text x="1620" y="668">JVM p/ Linux</text>
      <text x="1620" y="788">Linux</text>
      <text x="1620" y="908">Hardware</text>
    </g>

    <text x="950" y="1020" font-size="34" text-anchor="middle" fill="#111827">Linguagem híbrida — Java, C#</text>
  </g>
</svg>
