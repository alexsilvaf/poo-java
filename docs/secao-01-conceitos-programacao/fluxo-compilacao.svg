<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de compilação de um programa</title>
  <desc id="description">O código-fonte passa pela compilação e se torna código objeto. Depois, a construção gera o código executável.</desc>

  <defs>
    <linearGradient id="boxGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe4fa" />
      <stop offset="100%" stop-color="#83b3e3" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72b5e5" />
      <stop offset="100%" stop-color="#347fbd" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#163d5c" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1600" height="480" rx="20" fill="#ffffff" />

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#111827">
    <!-- Descrições acima das setas -->
    <text x="475" y="58" font-size="34" font-weight="700">Compilador:</text>
    <text x="475" y="100" font-size="34" font-weight="700">compilação</text>

    <text x="1125" y="58" font-size="34" font-weight="700">Gerador de código:</text>
    <text x="1125" y="100" font-size="34" font-weight="700">construção (build)</text>

    <!-- Caixas -->
    <g filter="url(#shadow)">
      <rect x="35" y="160" width="225" height="160" rx="8" fill="url(#boxGradient)" stroke="#5d97c8" stroke-width="3" />
      <rect x="688" y="160" width="225" height="160" rx="8" fill="url(#boxGradient)" stroke="#5d97c8" stroke-width="3" />
      <rect x="1340" y="160" width="225" height="160" rx="8" fill="url(#boxGradient)" stroke="#5d97c8" stroke-width="3" />
    </g>

    <!-- Setas -->
    <path d="M300 220 H625 V190 L670 240 L625 290 V260 H300 Z" fill="url(#arrowGradient)" stroke="#286ca4" stroke-width="3" />
    <path d="M953 220 H1278 V190 L1323 240 L1278 290 V260 H953 Z" fill="url(#arrowGradient)" stroke="#286ca4" stroke-width="3" />

    <!-- Textos das caixas -->
    <text x="147.5" y="226" font-size="34">Código</text>
    <text x="147.5" y="270" font-size="34">fonte</text>

    <text x="800.5" y="226" font-size="34">Código</text>
    <text x="800.5" y="270" font-size="34">objeto</text>

    <text x="1452.5" y="226" font-size="34">Código</text>
    <text x="1452.5" y="270" font-size="34">executável</text>

    <!-- Descrições abaixo das setas -->
    <g fill="#6b7280" font-size="30" font-style="italic">
      <text x="475" y="365">análise léxica</text>
      <text x="475" y="402">+</text>
      <text x="475" y="439">análise sintática</text>

      <text x="1125" y="383">geração de</text>
      <text x="1125" y="422">código</text>
    </g>
  </g>
</svg>
