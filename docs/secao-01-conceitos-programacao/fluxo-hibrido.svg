<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" role="img" aria-labelledby="title description">
  <title id="title">Fluxo da abordagem híbrida</title>
  <desc id="description">O código-fonte é compilado para bytecode, que uma máquina virtual interpreta ou compila para código nativo sob demanda.</desc>

  <defs>
    <linearGradient id="boxGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe4fa" />
      <stop offset="100%" stop-color="#83b3e3" />
    </linearGradient>
    <linearGradient id="executionGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd0b7" />
      <stop offset="100%" stop-color="#f59a73" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72b5e5" />
      <stop offset="100%" stop-color="#347fbd" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#163d5c" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1600" height="540" rx="20" fill="#ffffff" />

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#111827">
    <!-- Descrições acima das setas -->
    <text x="465" y="55" font-size="34" font-weight="700">Compilador:</text>
    <text x="465" y="98" font-size="34" font-weight="700">compilação</text>

    <text x="1110" y="55" font-size="34" font-weight="700">Máquina virtual:</text>
    <text x="1110" y="98" font-size="34" font-weight="700">interpretação / JIT</text>

    <!-- Código-fonte, bytecode e execução -->
    <g filter="url(#shadow)">
      <rect x="30" y="145" width="225" height="165" rx="8" fill="url(#boxGradient)" stroke="#5d97c8" stroke-width="3" />
      <rect x="688" y="145" width="225" height="165" rx="8" fill="url(#boxGradient)" stroke="#5d97c8" stroke-width="3" />
      <ellipse cx="1440" cy="227.5" rx="135" ry="102" fill="url(#executionGradient)" stroke="#df895d" stroke-width="3" />
    </g>

    <!-- Setas -->
    <path d="M285 207 H625 V180 L670 227.5 L625 275 V248 H285 Z" fill="url(#arrowGradient)" stroke="#286ca4" stroke-width="3" />
    <path d="M943 207 H1260 V180 L1305 227.5 L1260 275 V248 H943 Z" fill="url(#arrowGradient)" stroke="#286ca4" stroke-width="3" />

    <!-- Textos dos objetos -->
    <text x="142.5" y="218" font-size="34">Código</text>
    <text x="142.5" y="262" font-size="34">fonte</text>
    <text x="800.5" y="240" font-size="34">Bytecode</text>
    <text x="1440" y="240" font-size="36">Execução</text>

    <!-- Descrições abaixo das setas -->
    <g fill="#6b7280" font-size="30" font-style="italic">
      <text x="465" y="360">análises léxica e sintática</text>
      <text x="465" y="401">análise semântica</text>
      <text x="465" y="442">geração de bytecode</text>

      <text x="1110" y="380">execução ou geração de código nativo</text>
      <text x="1110" y="490" font-size="33">SOB DEMANDA</text>
    </g>
  </g>
</svg>
