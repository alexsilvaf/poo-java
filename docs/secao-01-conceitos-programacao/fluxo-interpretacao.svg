<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de interpretação de um programa</title>
  <desc id="description">O interpretador analisa o código-fonte, gera o código necessário sob demanda e executa o programa.</desc>

  <defs>
    <linearGradient id="sourceGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe4fa" />
      <stop offset="100%" stop-color="#83b3e3" />
    </linearGradient>
    <linearGradient id="executionGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd0b7" />
      <stop offset="100%" stop-color="#f59a73" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72b5e5" />
      <stop offset="100%" stop-color="#347fbd" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#163d5c" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1600" height="620" rx="20" fill="#ffffff" />

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#111827">
    <!-- Descrição acima da seta -->
    <text x="800" y="55" font-size="36" font-weight="700">Interpretador:</text>
    <text x="800" y="100" font-size="36" font-weight="700">interpretação</text>

    <!-- Código-fonte e execução -->
    <g filter="url(#shadow)">
      <rect x="40" y="145" width="330" height="170" rx="8" fill="url(#sourceGradient)" stroke="#5d97c8" stroke-width="3" />
      <ellipse cx="1410" cy="230" rx="155" ry="105" fill="url(#executionGradient)" stroke="#df895d" stroke-width="3" />
    </g>

    <!-- Seta -->
    <path d="M420 210 H1170 V180 L1220 230 L1170 280 V250 H420 Z" fill="url(#arrowGradient)" stroke="#286ca4" stroke-width="3" />

    <!-- Textos dos objetos -->
    <text x="205" y="243" font-size="38">Código fonte</text>
    <text x="1410" y="243" font-size="38">Execução</text>

    <!-- Etapas realizadas sob demanda -->
    <g fill="#6b7280" font-size="31" font-style="italic">
      <text x="800" y="352">análise léxica</text>
      <text x="800" y="394">+</text>
      <text x="800" y="436">análise sintática</text>
      <text x="800" y="478">+</text>
      <text x="800" y="520">geração de código</text>
      <text x="800" y="585" font-size="34">SOB DEMANDA</text>
    </g>
  </g>
</svg>
