<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 800" role="img" aria-labelledby="title description">
  <title id="title">Conversao entre tipos numericos em Java</title>
  <desc id="description">A conversao de um tipo menor para um maior e implicita e automatica. A conversao de um tipo maior para um menor exige casting explicito e pode perder informacao.</desc>

  <defs>
    <linearGradient id="boxGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9a0" />
      <stop offset="100%" stop-color="#ffbd0a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#163d5c" flood-opacity="0.18" />
    </filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#4f7f30" />
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#e12523" />
    </marker>
  </defs>

  <rect width="1900" height="800" rx="20" fill="#ffffff" />

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="950" y="66" font-size="32" text-anchor="middle" fill="#111827" font-weight="700">Quanto maior o tipo, mais valores ele consegue representar</text>

    <!-- Seta verde: widening (por cima) -->
    <path d="M170 190 H1760" fill="none" stroke="#4f7f30" stroke-width="6" marker-end="url(#arrowGreen)" />
    <text x="950" y="165" font-size="30" text-anchor="middle" fill="#4f7f30" font-weight="700">conversao implicita (widening) — automatica, sem perda</text>

    <!-- Caixas de tipos -->
    <g font-family="Consolas, 'Courier New', monospace">
      <g filter="url(#shadow)"><rect x="120" y="290" width="230" height="110" rx="12" fill="url(#boxGradient)" stroke="#b88600" stroke-width="3" /></g>
      <text x="235" y="345" font-size="34" text-anchor="middle" fill="#111827">byte</text>
      <text x="235" y="380" font-size="20" text-anchor="middle" fill="#5a4200" font-family="Arial">8 bits</text>

      <g filter="url(#shadow)"><rect x="390" y="290" width="230" height="110" rx="12" fill="url(#boxGradient)" stroke="#b88600" stroke-width="3" /></g>
      <text x="505" y="345" font-size="34" text-anchor="middle" fill="#111827">short</text>
      <text x="505" y="380" font-size="20" text-anchor="middle" fill="#5a4200" font-family="Arial">16 bits</text>

      <g filter="url(#shadow)"><rect x="660" y="290" width="230" height="110" rx="12" fill="url(#boxGradient)" stroke="#b88600" stroke-width="3" /></g>
      <text x="775" y="345" font-size="34" text-anchor="middle" fill="#111827">int</text>
      <text x="775" y="380" font-size="20" text-anchor="middle" fill="#5a4200" font-family="Arial">32 bits</text>

      <g filter="url(#shadow)"><rect x="930" y="290" width="230" height="110" rx="12" fill="url(#boxGradient)" stroke="#b88600" stroke-width="3" /></g>
      <text x="1045" y="345" font-size="34" text-anchor="middle" fill="#111827">long</text>
      <text x="1045" y="380" font-size="20" text-anchor="middle" fill="#5a4200" font-family="Arial">64 bits</text>

      <g filter="url(#shadow)"><rect x="1200" y="290" width="230" height="110" rx="12" fill="url(#boxGradient)" stroke="#b88600" stroke-width="3" /></g>
      <text x="1315" y="345" font-size="34" text-anchor="middle" fill="#111827">float</text>
      <text x="1315" y="380" font-size="20" text-anchor="middle" fill="#5a4200" font-family="Arial">32 bits</text>

      <g filter="url(#shadow)"><rect x="1470" y="290" width="250" height="110" rx="12" fill="url(#boxGradient)" stroke="#b88600" stroke-width="3" /></g>
      <text x="1595" y="345" font-size="34" text-anchor="middle" fill="#111827">double</text>
      <text x="1595" y="380" font-size="20" text-anchor="middle" fill="#5a4200" font-family="Arial">64 bits</text>
    </g>

    <!-- char entra em int -->
    <g filter="url(#shadow)"><rect x="660" y="470" width="230" height="80" rx="12" fill="#ffffff" stroke="#c7cbd1" stroke-width="2" /></g>
    <text x="775" y="522" font-size="32" text-anchor="middle" fill="#1f2937" font-family="Consolas, 'Courier New', monospace">char</text>
    <path d="M775 470 V410" fill="none" stroke="#4f7f30" stroke-width="5" marker-end="url(#arrowGreen)" />

    <!-- Seta vermelha: narrowing (por baixo) -->
    <path d="M1760 630 H170" fill="none" stroke="#e12523" stroke-width="6" marker-end="url(#arrowRed)" />
    <text x="950" y="680" font-size="30" text-anchor="middle" fill="#e12523" font-weight="700">conversao explicita (narrowing) — exige casting e pode perder informacao</text>

    <text x="950" y="735" font-size="24" text-anchor="middle" fill="#111827" font-family="Consolas, 'Courier New', monospace">int inteiro = (int) 3.99;   // resultado: 3</text>

    <text x="1810" y="230" font-size="22" text-anchor="end" fill="#6b7280" font-style="italic">boolean nao converte para nenhum outro tipo</text>
  </g>
</svg>
