<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 820" role="img" aria-labelledby="title description">
  <title id="title">Variaveis na memoria: stack e heap</title>
  <desc id="description">Variaveis de tipo primitivo guardam o proprio valor na stack. Variaveis de tipo por referencia guardam na stack o endereco de um objeto que vive na heap.</desc>

  <defs>
    <linearGradient id="boxGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9a0" />
      <stop offset="100%" stop-color="#ffbd0a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#163d5c" flood-opacity="0.18" />
    </filter>
    <marker id="ref" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#347fbd" />
    </marker>
  </defs>

  <rect width="1900" height="820" rx="20" fill="#ffffff" />

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Codigo -->
    <g filter="url(#shadow)"><rect x="60" y="70" width="520" height="220" rx="10" fill="#f8fafc" stroke="#c7cbd1" stroke-width="2" /></g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#1f2937">
      <text x="95" y="130"><tspan fill="#c026a3">int</tspan> idade = 25;</text>
      <text x="95" y="180"><tspan fill="#c026a3">double</tspan> saldo = 1500.0;</text>
      <text x="95" y="230">String nome = <tspan fill="#b45309">"Maria"</tspan>;</text>
    </g>
    <text x="320" y="330" font-size="24" text-anchor="middle" fill="#6b7280" font-style="italic">tres variaveis locais</text>

    <!-- Stack -->
    <g filter="url(#shadow)"><rect x="680" y="70" width="480" height="580" rx="14" fill="#ffffff" stroke="#5382a1" stroke-width="4" /></g>
    <text x="920" y="130" font-size="34" text-anchor="middle" fill="#2f5f7a" font-weight="700">Stack</text>
    <text x="920" y="166" font-size="21" text-anchor="middle" fill="#6b7280">variaveis locais do metodo</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="24">
      <rect x="720" y="200" width="400" height="110" rx="10" fill="url(#boxGradient)" stroke="#b88600" stroke-width="3" />
      <text x="745" y="240" font-size="20" fill="#5a4200" font-family="Arial">idade</text>
      <text x="920" y="288" font-size="34" text-anchor="middle" fill="#111827">25</text>

      <rect x="720" y="335" width="400" height="110" rx="10" fill="url(#boxGradient)" stroke="#b88600" stroke-width="3" />
      <text x="745" y="375" font-size="20" fill="#5a4200" font-family="Arial">saldo</text>
      <text x="920" y="423" font-size="34" text-anchor="middle" fill="#111827">1500.0</text>

      <rect x="720" y="470" width="400" height="110" rx="10" fill="#ffffff" stroke="#5382a1" stroke-width="3" stroke-dasharray="8 6" />
      <text x="745" y="510" font-size="20" fill="#2f5f7a" font-family="Arial">nome</text>
      <text x="920" y="556" font-size="28" text-anchor="middle" fill="#2f5f7a">0x7f3a...</text>
    </g>

    <!-- Seta stack -> heap -->
    <path d="M1130 525 H1290" fill="none" stroke="#347fbd" stroke-width="5" marker-end="url(#ref)" />
    <text x="1210" y="500" font-size="21" text-anchor="middle" fill="#2f5f7a" font-weight="700">referencia</text>

    <!-- Heap -->
    <g filter="url(#shadow)"><rect x="1320" y="380" width="520" height="270" rx="14" fill="#ffffff" stroke="#b88600" stroke-width="4" /></g>
    <text x="1580" y="440" font-size="34" text-anchor="middle" fill="#8f1614" font-weight="700">Heap</text>
    <text x="1580" y="474" font-size="21" text-anchor="middle" fill="#6b7280">objetos criados pelo programa</text>
    <rect x="1370" y="500" width="420" height="110" rx="10" fill="url(#boxGradient)" stroke="#b88600" stroke-width="3" />
    <text x="1580" y="545" font-size="21" text-anchor="middle" fill="#5a4200">objeto String</text>
    <text x="1580" y="588" font-size="32" text-anchor="middle" fill="#111827" font-family="Consolas, 'Courier New', monospace">"Maria"</text>

    <text x="950" y="720" font-size="27" text-anchor="middle" fill="#111827">Tipo primitivo guarda o proprio valor. Tipo por referencia guarda o endereco do objeto.</text>
    <text x="950" y="772" font-size="23" text-anchor="middle" fill="#6b7280" font-style="italic">Por isso uma variavel de referencia pode valer null, e uma primitiva nunca pode.</text>
  </g>
</svg>
