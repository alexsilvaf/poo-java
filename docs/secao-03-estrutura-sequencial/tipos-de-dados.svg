<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 900" role="img" aria-labelledby="title description">
  <title id="title">Tipos de dados em Java</title>
  <desc id="description">Os tipos de dados de Java se dividem em oito tipos primitivos e tipos por referencia. String e o primeiro tipo por referencia usado no curso.</desc>

  <defs>
    <linearGradient id="rootGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9a0" />
      <stop offset="100%" stop-color="#ffbd0a" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#163d5c" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1900" height="900" rx="20" fill="#ffffff" />

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Raiz -->
    <g filter="url(#shadow)">
      <rect x="720" y="50" width="460" height="90" rx="12" fill="url(#rootGradient)" stroke="#b88600" stroke-width="3" />
    </g>
    <text x="950" y="108" font-size="34" text-anchor="middle" fill="#111827" font-weight="700">Tipos de dados em Java</text>

    <!-- Conectores nivel 1 -->
    <path d="M950 140 V180 H500 V220" fill="none" stroke="#347fbd" stroke-width="4" />
    <path d="M950 140 V180 H1400 V220" fill="none" stroke="#347fbd" stroke-width="4" />

    <!-- Primitivos -->
    <g filter="url(#shadow)">
      <rect x="280" y="220" width="440" height="86" rx="12" fill="url(#rootGradient)" stroke="#b88600" stroke-width="3" />
    </g>
    <text x="500" y="266" font-size="30" text-anchor="middle" fill="#111827" font-weight="700">Tipos primitivos</text>
    <text x="500" y="294" font-size="20" text-anchor="middle" fill="#5a4200">guardam o proprio valor</text>

    <!-- Referencia -->
    <g filter="url(#shadow)">
      <rect x="1180" y="220" width="440" height="86" rx="12" fill="url(#rootGradient)" stroke="#b88600" stroke-width="3" />
    </g>
    <text x="1400" y="266" font-size="30" text-anchor="middle" fill="#111827" font-weight="700">Tipos por referencia</text>
    <text x="1400" y="294" font-size="20" text-anchor="middle" fill="#5a4200">primeiro exemplo: String</text>

    <!-- Conectores primitivos -->
    <path d="M500 306 V350 H200 V390" fill="none" stroke="#347fbd" stroke-width="3" />
    <path d="M500 306 V350 H420 V390" fill="none" stroke="#347fbd" stroke-width="3" />
    <path d="M500 306 V350 H620 V390" fill="none" stroke="#347fbd" stroke-width="3" />
    <path d="M500 306 V350 H820 V390" fill="none" stroke="#347fbd" stroke-width="3" />

    <!-- Grupos primitivos -->
    <g font-size="22" fill="#3d3d3d">
      <g filter="url(#shadow)"><rect x="90" y="390" width="220" height="300" rx="10" fill="url(#leafGradient)" stroke="#c7cbd1" stroke-width="2" /></g>
      <text x="200" y="428" font-size="24" text-anchor="middle" fill="#8f1614" font-weight="700">Inteiros</text>
      <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#1f2937" text-anchor="middle">
        <text x="200" y="490">byte</text>
        <text x="200" y="540">short</text>
        <text x="200" y="590">int</text>
        <text x="200" y="640">long</text>
      </g>

      <g filter="url(#shadow)"><rect x="330" y="390" width="180" height="300" rx="10" fill="url(#leafGradient)" stroke="#c7cbd1" stroke-width="2" /></g>
      <text x="420" y="428" font-size="24" text-anchor="middle" fill="#8f1614" font-weight="700">Reais</text>
      <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#1f2937" text-anchor="middle">
        <text x="420" y="490">float</text>
        <text x="420" y="540">double</text>
      </g>

      <g filter="url(#shadow)"><rect x="530" y="390" width="180" height="300" rx="10" fill="url(#leafGradient)" stroke="#c7cbd1" stroke-width="2" /></g>
      <text x="620" y="428" font-size="24" text-anchor="middle" fill="#8f1614" font-weight="700">Logico</text>
      <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#1f2937" text-anchor="middle">
        <text x="620" y="490">boolean</text>
      </g>
      <text x="620" y="530" font-size="19" text-anchor="middle" fill="#6b7280">true / false</text>

      <g filter="url(#shadow)"><rect x="730" y="390" width="180" height="300" rx="10" fill="url(#leafGradient)" stroke="#c7cbd1" stroke-width="2" /></g>
      <text x="820" y="428" font-size="24" text-anchor="middle" fill="#8f1614" font-weight="700">Caractere</text>
      <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#1f2937" text-anchor="middle">
        <text x="820" y="490">char</text>
      </g>
      <text x="820" y="530" font-size="19" text-anchor="middle" fill="#6b7280">16 bits, Unicode</text>
    </g>

    <!-- Conectores referencia -->
    <path d="M1400 306 V350 H1400 V390" fill="none" stroke="#347fbd" stroke-width="3" />

    <g filter="url(#shadow)"><rect x="1180" y="390" width="440" height="300" rx="10" fill="url(#leafGradient)" stroke="#c7cbd1" stroke-width="2" /></g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#1f2937" text-anchor="middle">
      <text x="1400" y="490">String</text>
    </g>
    <text x="1400" y="565" font-size="22" text-anchor="middle" fill="#6b7280">outros tipos por referencia</text>
    <text x="1400" y="600" font-size="22" text-anchor="middle" fill="#6b7280">serao estudados depois</text>

    <text x="950" y="770" font-size="27" text-anchor="middle" fill="#111827">Os oito tipos primitivos comecam com letra minuscula.</text>
    <text x="950" y="825" font-size="23" text-anchor="middle" fill="#6b7280" font-style="italic">Variaveis locais nao recebem valor padrao: precisam ser inicializadas antes do uso.</text>
  </g>
</svg>
