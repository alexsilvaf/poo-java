<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de uma estrutura for</title>
  <desc id="desc">A inicialização ocorre uma vez. A condição controla a entrada no corpo; após o corpo, a atualização leva novamente à condição.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.label{font-family:Arial,sans-serif;font-size:20px;fill:#0f172a;text-anchor:middle}.small{font-family:Arial,sans-serif;font-size:17px;fill:#334155;text-anchor:middle}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="350" y="20" width="220" height="58" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="460" y="56" class="label">Inicialização</text>
  <path d="M460 78 L460 120" class="line"/>
  <polygon points="460,120 595,190 460,260 325,190" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="460" y="185" class="label">Condição</text>
  <text x="460" y="210" class="small">é verdadeira?</text>
  <path d="M460 260 L460 305" class="line"/>
  <text x="495" y="288" class="small">true</text>
  <rect x="345" y="305" width="230" height="62" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="460" y="343" class="label">Corpo do for</text>
  <path d="M460 367 L460 412" class="line"/>
  <rect x="345" y="412" width="230" height="62" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="460" y="450" class="label">Atualização</text>
  <path d="M345 443 L190 443 L190 190 L320 190" class="line"/>
  <path d="M595 190 L760 190 L760 470" class="line"/>
  <text x="675" y="175" class="small">false</text>
  <rect x="650" y="470" width="220" height="58" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text x="760" y="506" class="label">Continuação</text>
</svg>
