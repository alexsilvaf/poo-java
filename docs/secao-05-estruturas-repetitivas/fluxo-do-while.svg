<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de uma estrutura do-while</title>
  <desc id="desc">O corpo executa antes da condição. Se a condição for verdadeira, o fluxo retorna ao corpo; se falsa, continua.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.label{font-family:Arial,sans-serif;font-size:20px;fill:#0f172a;text-anchor:middle}.small{font-family:Arial,sans-serif;font-size:17px;fill:#334155;text-anchor:middle}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="300" y="25" width="220" height="58" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="410" y="61" class="label">Início</text>
  <path d="M410 83 L410 130" class="line"/>
  <rect x="295" y="130" width="230" height="65" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="410" y="170" class="label">Corpo do do-while</text>
  <path d="M410 195 L410 245" class="line"/>
  <polygon points="410,245 545,315 410,385 275,315" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="410" y="310" class="label">Condição</text>
  <text x="410" y="335" class="small">é verdadeira?</text>
  <path d="M275 315 L150 315 L150 162 L290 162" class="line"/>
  <text x="215" y="300" class="small">true</text>
  <path d="M545 315 L680 315 L680 420" class="line"/>
  <text x="610" y="300" class="small">false</text>
  <rect x="570" y="420" width="220" height="58" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text x="680" y="456" class="label">Continuação</text>
</svg>
